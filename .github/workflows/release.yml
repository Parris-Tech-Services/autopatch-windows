name: Build and publish Windows exe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # Publishing runs (main, manual) share one queue so only one touches the release at a time.
  # Each pull request gets its own queue, so a PR run can never displace the run that publishes.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf -y install python3 git findutils util-linux procps-ng
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the single-file app
        run: python3 tools/build_pyz.py dist/autopatch-linux.pyz
      - name: Smoke test on a real Fedora system (real dnf)
        run: python3 tests/smoke_linux.py dist/autopatch-linux.pyz
        timeout-minutes: 20
  release:
    needs: fedora
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Stamp the version
        shell: bash
        run: |
          echo "BUILD = \"${GITHUB_SHA::7} $(date -u +%Y-%m-%d\ %H:%M)Z\"" > windows/_version.py
          cp windows/_version.py linux/_version.py
          python tools/build_pyz.py dist/autopatch-linux.pyz
      - name: Build exe
        run: |
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --name autopatch-windows --add-data "devices/agent-windows.ps1;devices" --add-data "windows/posture.ps1;." --paths . windows/app.py
      - name: Bundled scripts are inside the exe
        run: python -c "import sys;d=open('dist/autopatch-windows.exe','rb').read();sys.exit(0 if b'posture.ps1' in d and b'agent-windows.ps1' in d else 1)"
      - name: Smoke test the built exe on real Windows
        run: python tests/smoke_exe.py dist/autopatch-windows.exe
        timeout-minutes: 15
      - name: Publish as the latest release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/autopatch-windows.exe dist/autopatch-linux.pyz --title "AutoPatch (latest): Windows exe and Fedora/Linux app" --notes "Read-only. Windows: autopatch-windows.exe is unsigned, so SmartScreen will warn; choose More info, then Run anyway. Fedora/Linux: python3 autopatch-linux.pyz. Built from commit ${{ github.sha }}."
      - name: Elevation test (informational, runs after publishing so it never delays a release)
        run: python tests/smoke_exe.py dist/autopatch-windows.exe elevation
        timeout-minutes: 15
        continue-on-error: true
